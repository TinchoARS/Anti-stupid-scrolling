name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: test-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx expo prebuild --platform ios --non-interactive

      - name: pod install
        working-directory: test-app/ios
        run: pod install

      - name: Build (no code signing)
        working-directory: test-app/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$(ls -d *.xcodeproj | grep -v '^Pods\.xcodeproj$' | head -n 1)" .xcodeproj)
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under Release-iphoneos build products:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r AntiIGTest-unsigned.ipa Payload
          mkdir -p "${{ github.workspace }}/test-app/build"
          cp AntiIGTest-unsigned.ipa "${{ github.workspace }}/test-app/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: AntiIGTest-unsigned-ipa
          path: test-app/build/AntiIGTest-unsigned.ipa
